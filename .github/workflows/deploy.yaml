name: Deploy Resume Website

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-west-2
  TF_VERSION: 1.14.3

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash
        working-directory: ./infra
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::593857178529:role/github-actions-deploy
        aws-region: ${{ env.AWS_REGION }}

    - name: Create config.js
      run: |
        echo "const CONFIG = {" > ../website/config.js
        echo "    API_URL: '${{ secrets.API_URL }}'," >> ../website/config.js
        echo "    COUNTER_URL: '${{ secrets.COUNTER_URL }}'," >> ../website/config.js
        echo "    LAST_DEPLOY: '$(date -u +%Y-%m-%dT%H:%M:%SZ)'," >> ../website/config.js
        echo "    COMMIT: '${GITHUB_SHA::7}'" >> ../website/config.js
        echo "};" >> ../website/config.js
    
    - name: Check Lambda code
      run: |
        node --check ../lambda/chatbot.js
        node --check ../visitor-counter/index.js

    - name: Install Node.js dependencies (Visitor Counter)
      run: |
        cd ../visitor-counter
        npm install
        cd ../infra
    
    - name: Install Node.js dependencies (Chatbot)
      run: |
        cd ../lambda
        npm install
        cd ../infra

    - name: Create Chatbot Lambda ZIP
      run: |
        cd ../lambda
        zip -r chatbot.zip . -x "*.zip"
        cd ../infra
    
    - name: Terraform Format
      id: fmt
      run: terraform fmt -check
      continue-on-error: true
    
    - name: Terraform Init
      id: init
      run: terraform init
    
    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color
    
    - name: Terraform Plan
      id: plan
      if: github.event_name == 'pull_request'
      run: terraform plan -no-color -input=false
      continue-on-error: true
    
    - name: Update Pull Request
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
          #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
          #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
          #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
          
          <details><summary>Show Plan</summary>
          
          \`\`\`\n
          ${process.env.PLAN}
          \`\`\`
          
          </details>
          
          *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })
    
    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1
    
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false -var="bucket_name=${{ secrets.S3_BUCKET_NAME }}" -var="environment=production" -var="project_name=resume-website"

  deploy-website:
    name: 'Deploy Website Files'
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::593857178529:role/github-actions-deploy
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Sync website files to S3
      run: |
        aws s3 sync ./website/ s3://${{ secrets.S3_BUCKET_NAME }}
    
    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

    - name: Smoke test live site
      run: |
        curl -sf https://hunterulrich.dev/ | grep -q "Hunter Ulrich"
        echo "Website is up"
        curl -sf "${{ secrets.COUNTER_URL }}?peek=1" | grep -q '"count"'
        echo "Visitor counter API works"
        curl -sf -X POST -H "Content-Type: application/json" -d '{"message":"skills"}' "${{ secrets.API_URL }}" | grep -q '"reply"'
        echo "Chatbot API works"